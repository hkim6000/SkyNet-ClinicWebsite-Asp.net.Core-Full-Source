<div class="rm-site rm-admin" id="rm-site" data-theme="light" style="{plhd_style}">
<header class="rm-ahead">
    <button type="button" class="rm-ibtn rm-burger" aria-label="Menu" onclick="AdminRoomsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="rm-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="rm-demo" id="rm-demo"></span>
    <span class="rm-grow"></span>
    <a class="rm-who" id="rm-who" href="AdminAccount"></a>
    <a class="rm-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="rm-out" onclick="AdminRoomsJs.signOut()">Sign out</button>
</header>
<aside class="rm-side" id="rm-nav" aria-label="Admin">
    <div class="rm-nav-top"><span>Menu</span><button type="button" class="rm-ibtn" aria-label="Close" onclick="AdminRoomsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="rm-amenu" id="rm-menu"></ul>
</aside>
<div class="rm-scrim" id="rm-scrim" onclick="AdminRoomsJs.closeNav()"></div>
<main class="rm-amain" id="rm-main"><p class="rm-loading">Loading&hellip;</p></main>
<div class="rm-modal" id="rm-modal" onclick="if(event.target===this)AdminRoomsJs.closeModal()">
    <div class="rm-mbox" role="dialog" aria-modal="true"><button type="button" class="rm-ibtn rm-mclose" aria-label="Close" onclick="AdminRoomsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="rm-mbody"></div></div>
</div>
<div class="rm-toast" id="rm-toast" role="status" aria-live="polite"></div>
</div>
