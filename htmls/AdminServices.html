<div class="ss-site ss-admin" id="ss-site" data-theme="light" style="{plhd_style}">
<header class="ss-ahead">
    <button type="button" class="ss-ibtn ss-burger" aria-label="Menu" onclick="AdminServicesJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ss-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="ss-demo" id="ss-demo"></span>
    <span class="ss-grow"></span>
    <a class="ss-who" id="ss-who" href="AdminAccount"></a>
    <a class="ss-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ss-out" onclick="AdminServicesJs.signOut()">Sign out</button>
</header>
<aside class="ss-side" id="ss-nav" aria-label="Admin">
    <div class="ss-nav-top"><span>Menu</span><button type="button" class="ss-ibtn" aria-label="Close" onclick="AdminServicesJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ss-amenu" id="ss-menu"></ul>
</aside>
<div class="ss-scrim" id="ss-scrim" onclick="AdminServicesJs.closeNav()"></div>
<main class="ss-amain" id="ss-main"><p class="ss-loading">Loading&hellip;</p></main>
<div class="ss-modal" id="ss-modal" onclick="if(event.target===this)AdminServicesJs.closeModal()">
    <div class="ss-mbox" role="dialog" aria-modal="true"><button type="button" class="ss-ibtn ss-mclose" aria-label="Close" onclick="AdminServicesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ss-mbody"></div></div>
</div>
<div class="ss-toast" id="ss-toast" role="status" aria-live="polite"></div>
</div>
