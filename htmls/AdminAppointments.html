<div class="ap-site ap-admin" id="ap-site" data-theme="light" style="{plhd_style}">
<header class="ap-ahead">
    <button type="button" class="ap-ibtn ap-burger" aria-label="Menu" onclick="AdminAppointmentsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ap-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="ap-demo" id="ap-demo"></span>
    <span class="ap-grow"></span>
    <a class="ap-who" id="ap-who" href="AdminAccount"></a>
    <a class="ap-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ap-out" onclick="AdminAppointmentsJs.signOut()">Sign out</button>
</header>
<aside class="ap-side" id="ap-nav" aria-label="Admin">
    <div class="ap-nav-top"><span>Menu</span><button type="button" class="ap-ibtn" aria-label="Close" onclick="AdminAppointmentsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ap-amenu" id="ap-menu"></ul>
</aside>
<div class="ap-scrim" id="ap-scrim" onclick="AdminAppointmentsJs.closeNav()"></div>
<main class="ap-amain" id="ap-main"><p class="ap-loading">Loading&hellip;</p></main>
<div class="ap-modal" id="ap-modal" onclick="if(event.target===this)AdminAppointmentsJs.closeModal()">
    <div class="ap-mbox" role="dialog" aria-modal="true"><button type="button" class="ap-ibtn ap-mclose" aria-label="Close" onclick="AdminAppointmentsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ap-mbody"></div></div>
</div>
<div class="ap-toast" id="ap-toast" role="status" aria-live="polite"></div>
</div>
