<div class="wk-site wk-admin" id="wk-site" data-theme="light" style="{plhd_style}">
<header class="wk-ahead">
    <button type="button" class="wk-ibtn wk-burger" aria-label="Menu" onclick="AdminWeekJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="wk-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="wk-demo" id="wk-demo"></span>
    <span class="wk-grow"></span>
    <a class="wk-who" id="wk-who" href="AdminAccount"></a>
    <a class="wk-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="wk-out" onclick="AdminWeekJs.signOut()">Sign out</button>
</header>
<aside class="wk-side" id="wk-nav" aria-label="Admin">
    <div class="wk-nav-top"><span>Menu</span><button type="button" class="wk-ibtn" aria-label="Close" onclick="AdminWeekJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="wk-amenu" id="wk-menu"></ul>
</aside>
<div class="wk-scrim" id="wk-scrim" onclick="AdminWeekJs.closeNav()"></div>
<main class="wk-amain" id="wk-main"><p class="wk-loading">Loading&hellip;</p></main>
<div class="wk-modal" id="wk-modal" onclick="if(event.target===this)AdminWeekJs.closeModal()">
    <div class="wk-mbox" role="dialog" aria-modal="true"><button type="button" class="wk-ibtn wk-mclose" aria-label="Close" onclick="AdminWeekJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="wk-mbody"></div></div>
</div>
<div class="wk-toast" id="wk-toast" role="status" aria-live="polite"></div>
</div>
