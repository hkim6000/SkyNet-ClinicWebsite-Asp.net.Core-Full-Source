<div class="sc-site sc-admin" id="sc-site" data-theme="light" style="{plhd_style}">
<header class="sc-ahead">
    <button type="button" class="sc-ibtn sc-burger" aria-label="Menu" onclick="AdminScheduleJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="sc-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="sc-demo" id="sc-demo"></span>
    <span class="sc-grow"></span>
    <a class="sc-who" id="sc-who" href="AdminAccount"></a>
    <a class="sc-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="sc-out" onclick="AdminScheduleJs.signOut()">Sign out</button>
</header>
<aside class="sc-side" id="sc-nav" aria-label="Admin">
    <div class="sc-nav-top"><span>Menu</span><button type="button" class="sc-ibtn" aria-label="Close" onclick="AdminScheduleJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="sc-amenu" id="sc-menu"></ul>
</aside>
<div class="sc-scrim" id="sc-scrim" onclick="AdminScheduleJs.closeNav()"></div>
<main class="sc-amain" id="sc-main"><p class="sc-loading">Loading&hellip;</p></main>
<div class="sc-modal" id="sc-modal" onclick="if(event.target===this)AdminScheduleJs.closeModal()">
    <div class="sc-mbox" role="dialog" aria-modal="true"><button type="button" class="sc-ibtn sc-mclose" aria-label="Close" onclick="AdminScheduleJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="sc-mbody"></div></div>
</div>
<div class="sc-toast" id="sc-toast" role="status" aria-live="polite"></div>
</div>
